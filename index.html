<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 960px;
            width: 100%;
        }

        /* ===== 大标题居中 ===== */
        .site-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .site-title {
            font-size: 36px;
            font-weight: 700;
            color: #1a1e24;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .site-sub {
            font-size: 15px;
            color: #5e6670;
            margin-bottom: 6px;
        }

        .site-link {
            display: inline-block;
            font-size: 14px;
            color: #2563eb;
            text-decoration: none;
            border: 1px solid #2563eb30;
            padding: 4px 16px;
            border-radius: 30px;
            transition: background 0.15s;
        }

        .site-link:hover {
            background: #2563eb10;
        }

        /* ===== 宫格 ===== */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            list-style: none;
            border: 2px solid #d0d5dd;
        }

        .tool-grid li {
            margin: 0;
        }

        .tool-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 28px 16px 22px;
            background: #ffffff;
            border-right: 2px solid #d0d5dd;
            border-bottom: 2px solid #d0d5dd;
            text-decoration: none;
            color: #1a1e24;
            transition: background 0.15s;
            height: 100%;
        }

        /* 每行最后一个去掉右边框 */
        .tool-grid li:nth-child(3n) .tool-card {
            border-right: none;
        }

        /* 最后一行去掉下边框 */
        .tool-grid li:nth-last-child(-n+3) .tool-card {
            border-bottom: none;
        }

        .tool-card:hover {
            background: #f0f2f5;
        }

        .tool-icon {
            font-size: 36px;
            line-height: 1;
            margin-bottom: 10px;
        }

        .tool-name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1e24;
            margin-bottom: 6px;
        }

        .tool-desc {
            font-size: 13px;
            color: #6e7687;
            line-height: 1.5;
            font-weight: 400;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .tool-grid {
                grid-template-columns: repeat(2, 1fr);
                border: 2px solid #d0d5dd;
            }

            .tool-grid li:nth-child(3n) .tool-card {
                border-right: 2px solid #d0d5dd;
            }

            .tool-grid li:nth-child(2n) .tool-card {
                border-right: none;
            }

            .tool-grid li:nth-last-child(-n+2) .tool-card {
                border-bottom: none;
            }

            .tool-grid li:last-child .tool-card {
                border-bottom: none;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }
            .site-title {
                font-size: 28px;
            }
            .tool-grid {
                grid-template-columns: 1fr;
                border: 2px solid #d0d5dd;
            }

            .tool-grid li .tool-card {
                border-right: none;
                flex-direction: row;
                text-align: left;
                gap: 14px;
                align-items: center;
                padding: 16px 18px;
            }

            .tool-grid li:last-child .tool-card {
                border-bottom: none;
            }

            .tool-icon {
                font-size: 28px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .tool-name {
                font-size: 16px;
                margin-bottom: 2px;
            }
            .tool-desc {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部 -->
        <header class="site-header">
            <h1 class="site-title">我的工具</h1>
            <div class="site-sub">如有改进意见，可以从GitHub仓库下载原文件自行修改</div>
            <a class="site-link" href="https://github.com/xuningji/my-tools" target="_blank">
                🔗 GitHub
            </a>
        </header>

        <!-- 宫格 -->
        <ul class="tool-grid">
            <li>
                <a href="./timeline/" class="tool-card">
                    <span class="tool-icon">📅</span>
                    <div>
                        <div class="tool-name">时间轴</div>
                        <div class="tool-desc">按时间顺序排列事件，可导出图片和JSON配置，适用于公历</div>
                    </div>
                </a>
            </li>
            <li>
                <a href="./timeline-commen/" class="tool-card">
                    <span class="tool-icon">📅</span>
                    <div>
                        <div class="tool-name">时间轴（通用版）</div>
                        <div class="tool-desc">支持公历、农历、架空历等多种历法，完全自定义事件顺序</div>
                    </div>
                </a>
            </li>
            <li>
                <a href="./cp-relationship/" class="tool-card">
                    <span class="tool-icon">❤️</span>
                    <div>
                        <div class="tool-name">CP连线图</div>
                        <div class="tool-desc">上传图片或输入名字，会自动围成一个圈，可自定义图例</div>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</body>
</html>
